name: Pull verified Holla preview

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: update-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Verify release and update tap (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact preview asset set
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata=$(gh release view preview --repo tailrocks/holla --json name,targetCommitish)
          version=$(jq -er '.name | sub("^Preview "; "")' <<< "$metadata")
          source_sha=$(jq -er '.targetCommitish' <<< "$metadata")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+\+[0-9a-f]{7}$ ]]
          mkdir artifacts
          gh release download preview --repo tailrocks/holla --dir artifacts
          cat > expected-assets <<'EOF'
          holla-aarch64-apple-darwin.tar.gz
          holla-aarch64-apple-darwin.tar.gz.sha256
          holla-aarch64-unknown-linux-gnu.tar.gz
          holla-aarch64-unknown-linux-gnu.tar.gz.sha256
          holla-x86_64-apple-darwin.tar.gz
          holla-x86_64-apple-darwin.tar.gz.sha256
          holla-x86_64-unknown-linux-gnu.tar.gz
          holla-x86_64-unknown-linux-gnu.tar.gz.sha256
          EOF
          find artifacts -maxdepth 1 -type f -exec basename {} \; | sort > actual-assets
          diff -u expected-assets actual-assets
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify checksums and GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-gnu
          )
          for target in "${targets[@]}"; do
            archive="artifacts/holla-${target}.tar.gz"
            expected=$(tr -d '\n' < "${archive}.sha256")
            actual=$(sha256sum "$archive" | awk '{print $1}')
            test "$expected" = "$actual"
            gh attestation verify "$archive" \
              --repo tailrocks/holla \
              --signer-workflow tailrocks/holla/.github/workflows/preview.yml \
              --source-ref refs/heads/main \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners >/dev/null
          done

      - name: Verify executable identity
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir verified-binary
          tar -xzf artifacts/holla-x86_64-unknown-linux-gnu.tar.gz -C verified-binary
          test "$(verified-binary/holla --version)" = "holla ${VERSION}"

      - name: Rewrite rolling preview formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          arm64_macos=$(cat artifacts/holla-aarch64-apple-darwin.tar.gz.sha256)
          x86_macos=$(cat artifacts/holla-x86_64-apple-darwin.tar.gz.sha256)
          arm64_linux=$(cat artifacts/holla-aarch64-unknown-linux-gnu.tar.gz.sha256)
          x86_linux=$(cat artifacts/holla-x86_64-unknown-linux-gnu.tar.gz.sha256)
          cat > Formula/holla-preview.rb <<EOF
          # source-sha: ${SOURCE_SHA}
          class HollaPreview < Formula
            desc "Adaptive dev environment CLI — preview build from latest main"
            homepage "https://github.com/tailrocks/holla"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-aarch64-apple-darwin.tar.gz"
                sha256 "${arm64_macos}"
              end
              on_intel do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-x86_64-apple-darwin.tar.gz"
                sha256 "${x86_macos}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${arm64_linux}"
              end
              on_intel do
                url "https://github.com/tailrocks/holla/releases/download/preview/holla-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${x86_linux}"
              end
            end

            conflicts_with "tailrocks/holla/holla", because: "preview and stable install the same binary"

            def install
              bin.install "holla"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/holla --version")
            end
          end
          EOF

      - name: Mint package updater token
        if: matrix.config.writer
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.PACKAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.PACKAGE_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Open verified tap update pull request
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          BOT_LOGIN: ${{ vars.PACKAGE_UPDATER_BOT_LOGIN }}
          BOT_EMAIL: ${{ vars.PACKAGE_UPDATER_BOT_EMAIL }}
          BRANCH: package-update/verified/preview
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/holla-preview.rb; then
            echo "Tap already matches ${SOURCE_SHA}"
            exit 0
          fi
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_EMAIL"
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git add Formula/holla-preview.rb
          git commit --signoff -m "chore: update preview ${VERSION}" \
            -m "Co-authored-by: Codex <codex@openai.com>"
          gh auth setup-git
          git push --force-with-lease origin "$BRANCH"
          OPEN_PR_COUNT="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq 'length')"
          test "$OPEN_PR_COUNT" -le 1
          if test "$OPEN_PR_COUNT" -eq 0; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update preview ${VERSION}" \
              --body "Verified preview update from tailrocks/holla@${SOURCE_SHA}."
          fi
          gh pr merge "$BRANCH" --auto --squash --delete-branch

  update-required:
    needs: [update]
    if: always()
    name: Update preview required (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled need
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled") | not' >/dev/null \
            || { echo "A required job failed or was cancelled." >&2; exit 1; }
